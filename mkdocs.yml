site_name: mc-kernel
site_description: Shared, platform-neutral Minecraft vocabulary for nerima-games packages.
site_url: https://nerima-games.github.io/mc-kernel/

repo_name: nerima-games/mc-kernel
repo_url: https://github.com/nerima-games/mc-kernel
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  icon:
    repo: fontawesome/brands/github
    logo: material/cube-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: ダークテーマに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ライトテーマに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      title: このページ

nav:
  - ホーム: README.md
  - はじめに:
      - アーキテクチャ: architecture.md
      - 座標キー移行: block-position-key-migration.md
  - リファレンス:
      - 公開 API: api-reference.md
  - プロジェクト:
      - テストと検証: testing.md
      - バージョニングと公開: versioning.md
