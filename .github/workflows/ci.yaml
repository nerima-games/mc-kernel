name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag is a mutable
        # reference the upstream owner can repoint at any time (SUPPLY_CHAIN.md
        # "アクションの固定").
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md "アクションの固定").
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Keep CI's toolchain identical to the documented local environment.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        # pnpm-workspace.yaml allows only the esbuild build required by the
        # dependency graph; keeping lifecycle scripts enabled preserves that
        # explicit policy and matches local frozen installs.
        run: nix develop --command pnpm install --frozen-lockfile

      # verify covers typecheck, lint, and the unit suite. The test lifecycle
      # also builds the release artifact first, so a clean checkout exercises
      # the same package boundary as a consumer.
      - name: Verify
        run: nix develop --command pnpm verify

      # The 100% gate (docs/testing.md §5 row 7), and it is this step that
      # enforces it. No extra flag is needed and none should be added: the
      # thresholds live in vitest.config.ts, and `vitest run --coverage` exits
      # non-zero by itself when any of the four falls below. Keeping the numbers
      # in the config rather than here means `pnpm test:coverage` gates
      # identically on a laptop and in CI, so the gate cannot be one that only
      # ever fires after a push.
      #
      # NOTE: `pnpm verify` deliberately does NOT include this step — it runs
      # `pnpm test` without coverage. Run `pnpm test:coverage` before pushing if
      # you have touched a branch in src/domain/.
      - name: Coverage (100% gate)
        run: nix develop --command pnpm test:coverage

      # Exercise the exact packed bytes in a clean consumer before a release
      # can be created. This catches export-map and files-allowlist mistakes
      # that source tests cannot observe.
      - name: Verify package boundary
        run: nix develop --command pnpm package:verify

      - name: Upload coverage report
        if: always()
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md "アクションの固定").
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
