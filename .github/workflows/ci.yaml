name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag is a mutable
        # reference the upstream owner can repoint at any time (SUPPLY_CHAIN.md
        # "アクションの固定").
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md "アクションの固定").
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      # Keep CI's toolchain identical to the documented local environment.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        # pnpm-workspace.yaml allows only the esbuild build required by the
        # dependency graph; keeping lifecycle scripts enabled preserves that
        # explicit policy and matches local frozen installs.
        run: nix develop --command pnpm install --frozen-lockfile

      # verify covers typecheck, lint, the unit suite, and the 100% coverage gate.
      # Its test lifecycle also builds the release artifact; the next step checks
      # that artifact from a clean consumer boundary.
      - name: Verify
        run: nix develop --command pnpm verify

      # Exercise the exact packed bytes in a clean consumer before a release
      # can be created. This catches export-map and files-allowlist mistakes
      # that source tests cannot observe.
      - name: Verify package boundary
        run: nix develop --command pnpm package:verify

      # Deliberately NOT `--prod`. The runtime dependency list is one package,
      # so `pnpm audit --prod` is clean almost by construction and reads as a
      # pass while saying nothing about the toolchain that builds the artifact.
      # This step audits the whole tree; pin a transitive package in
      # pnpm-workspace.yaml's `overrides` when an advisory lands, rather than
      # narrowing the gate until it goes quiet.
      - name: Audit dependencies
        run: nix develop --command pnpm audit

      - name: Upload coverage report
        if: always()
        # Pinned to a commit, not the mutable v6 tag (SUPPLY_CHAIN.md "アクションの固定").
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
